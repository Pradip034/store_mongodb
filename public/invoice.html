<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Invoice | Health Partner</title><link rel="stylesheet" href="/style.css"><script src="/invoice.js" defer></script></head><body class="invoice-body">
<div class="invoice-toolbar no-print"><a href="/admin/orders">← Back to orders</a><button class="button" id="print" type="button">Print / Save as PDF</button></div>
<main class="invoice-main"><p id="invoice-status" role="status">Preparing your invoice…</p><article id="invoice" class="invoice" hidden>
<header class="invoice-head"><div class="brand"><span class="brand-mark" aria-hidden="true">hp.</span><span>Let Us Be Your<br><strong>Health Partner</strong></span></div><div class="invoice-title"><h1>Invoice</h1><p id="invoice-number"></p><p id="invoice-date"></p></div></header>
<section class="invoice-parties"><div><p class="eyebrow">FROM</p><p id="store-details"></p></div><div><p class="eyebrow">BILL &amp; DELIVER TO</p><p id="customer-details"></p></div><div><p class="eyebrow">PAYMENT</p><p id="payment-details"></p></div></section>
<table class="invoice-table"><thead><tr><th scope="col">Item</th><th scope="col">Pack</th><th scope="col" class="num">Price</th><th scope="col" class="num">Qty</th><th scope="col" class="num">Amount</th></tr></thead><tbody id="invoice-lines"></tbody><tfoot id="invoice-totals"></tfoot></table>
<p class="invoice-note">Order reference: <span id="order-ref"></span><br>Thank you for choosing fresh, honest food. For any questions about this order, contact us on WhatsApp with your order reference.</p>
</article></main></body></html>
